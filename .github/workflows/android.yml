name: Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          # Accept all SDK licenses automatically
          yes | sdkmanager --licenses 2>/dev/null || true
          
          # Ensure platform 34 and build-tools 34.0.0 are ready
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Install Web Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build
          npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Assemble Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Archive Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-growth-ai-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
